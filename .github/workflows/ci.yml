# GitHub Actions — Booking Ruang Meeting (Apps/web)
# Selaras Docs/Architecture-Aplikasi-Booking-Ruang-Meeting.md §8.4

name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_DIR: Apps/web
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://booking:booking_test@localhost:5432/booking_meeting_test
  REDIS_URL: redis://localhost:6379

defaults:
  run:
    working-directory: Apps/web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Apps/web/package-lock.json
      - run: npm ci
      - run: npm test

  integration-test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_test
          POSTGRES_DB: booking_meeting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_meeting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Apps/web/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Apps/web/package-lock.json
      - run: npm ci
      - name: Production build (no live DB/Redis required)
        run: npm run build
        env:
          REDIS_URL: ""
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/nodb

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - run: echo "Deploy web + worker ke staging (placeholder)"
      - run: echo "Jalankan migrasi DB sebagai pre-deploy job"

