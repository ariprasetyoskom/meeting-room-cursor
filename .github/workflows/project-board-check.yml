# Scheduler Kanban — PRD-GitHub-Project-Scheduler (F-SCH-02)
# Secret: GH_PROJECT_PAT (classic PAT, scope project)

name: Project board check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: Selaraskan issue closed → Done
        type: boolean
        default: false

concurrency:
  group: project-board-check
  cancel-in-progress: false

jobs:
  scheduler:
    if: ${{ vars.PROJECT_SCHEDULER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_OWNER: ariprasetyoskom
      PROJECT_NUMBER: "1"
      GITHUB_REPO: ariprasetyoskom/meeting-room-cursor
      PROJECT_SYNC_DELAY_MS: "800"
    steps:
      - uses: actions/checkout@v4

      - name: Validate GH_PROJECT_PAT
        run: |
          if [ -z "${{ secrets.GH_PROJECT_PAT }}" ]; then
            echo "::error::Secret GH_PROJECT_PAT belum diset (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Install GitHub CLI
        run: type gh || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Run project scheduler
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_PAT }}
        run: |
          SYNC="${{ github.event.inputs.sync }}"
          if [ "$SYNC" != "true" ] && [ "${{ vars.PROJECT_SYNC_ON_SCHEDULE }}" = "true" ]; then
            SYNC="true"
          fi
          ARGS=""
          if [ "$SYNC" = "true" ]; then
            ARGS="--sync"
          fi
          node Devops/scripts/run-project-scheduler.mjs $ARGS | tee scheduler-report.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-scheduler-report
          path: scheduler-report.txt
          if-no-files-found: ignore
