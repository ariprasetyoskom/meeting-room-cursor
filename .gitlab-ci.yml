# GitLab CI — Booking Ruang Meeting (Apps/web)
# Selaras Docs/Architecture-Aplikasi-Booking-Ruang-Meeting.md §8.4

stages:
  - lint
  - test
  - build
  - deploy

variables:
  WEB_DIR: Apps/web
  NODE_VERSION: "20"
  POSTGRES_USER: booking
  POSTGRES_PASSWORD: booking_test
  POSTGRES_DB: booking_meeting_test
  DATABASE_URL: postgresql://booking:booking_test@postgres:5432/booking_meeting_test
  REDIS_URL: redis://redis:6379

default:
  image: node:${NODE_VERSION}-bookworm
  cache:
    key: "${CI_COMMIT_REF_SLUG}-web"
    paths:
      - Apps/web/node_modules/
  before_script:
    - cd "${WEB_DIR}"
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint
    - npx tsc --noEmit

unit-test:
  stage: test
  needs: [lint]
  script:
    - npm test

integration-test:
  stage: test
  needs: [lint]
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  script:
    - npm run db:migrate
    - npm test

build:
  stage: build
  needs: [unit-test, integration-test]
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - Apps/web/.next/

deploy-staging:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging
  script:
    - echo "Deploy web + worker ke staging (placeholder)"
    - echo "Jalankan migrasi DB sebagai pre-deploy job"

